name: Deploy to Oracle

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            --exclude node_modules \
            --exclude .git \
            --exclude 'client/dist' \
            --exclude '.env' \
            ./ ubuntu@${{ secrets.ORACLE_HOST }}:/home/ubuntu/chesslens/

      - name: Install server deps & restart
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            "cd /home/ubuntu/chesslens/server && npm install --omit=dev --prefer-offline 2>/dev/null; pm2 restart chesslens --update-env"

      - name: Rebuild client
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.ORACLE_HOST }} \
            "cd /home/ubuntu/chesslens/client && npm install --prefer-offline 2>/dev/null && npm run build && chmod -R o+r dist"
